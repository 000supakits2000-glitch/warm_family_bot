name: Daily Warm Family Drama Bot

on:
  schedule:
    # รันทุกวันเวลา 21:00 UTC (ตรงกับ 04:00 น. เวลาประเทศไทย)
    - cron: '0 21 * * *'
  workflow_dispatch: # กดสั่งรันเองได้ทุกเมื่อจากหน้า GitHub

permissions:
  contents: write

jobs:
  generate-episode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-genai

      - name: Run Drama Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python warm_family_bot.py

      - name: Commit and push daily episode
        run: |
          git config --global user.name "Drama Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add today_episode.txt history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily warm family episode" && git push)
